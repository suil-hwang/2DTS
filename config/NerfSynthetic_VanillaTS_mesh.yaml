lr_delay_steps: &LR_DELAY_STEPS 2_000
lr_delay_mult: &LR_DELAY_MULT 1.0
lr_max_steps: &LR_MAX_STEPS 30_000
total_iter: &TOTAL_ITER 60_000
solidify_start_iter: &SOLIDIFY_START_ITER 40_000
solidify_end_iter: &SOLIDIFY_END_ITER 60_000

dataset:
    type: "NerfSynthetic"
    local_dir: null
    scene_id: null
    background: "random"
    test_background: "white"
    num_workers: 10
    cache_on_device: True # decode images once and serve cameras from the GPU instead of loader workers

    pcd_path: null
    train_target_res: null
    test_target_res: null
    hold_test_set: True

model:
    max_sh_degree: 3
    use_color_affine: False
    back_culling: False
    use_vertex_color: False
    gamma_rescale: True
    sort_level: 2 # 0: per triangle, 1: per tile, 2: per pixel
    ste_threshold: 0.3
    render_spp: 2

    optimizer:
        vertex:
            v_init: 0.0012
            v_final: 0.00002
            delay_steps: *LR_DELAY_STEPS
            delay_mult: *LR_DELAY_MULT
            max_steps: *LR_MAX_STEPS

        opacity:
            v_init: 0.05
            v_final: 0.001
            delay_steps: *LR_DELAY_STEPS
            delay_mult: *LR_DELAY_MULT
            max_steps: *LR_MAX_STEPS

        f_dc:
            v_init: 0.001
            v_final: 0.001
            delay_steps: *LR_DELAY_STEPS
            delay_mult: *LR_DELAY_MULT
            max_steps: *LR_MAX_STEPS

        f_rest:
            v_init: 0.0002
            v_final: 0.0002
            delay_steps: *LR_DELAY_STEPS
            delay_mult: *LR_DELAY_MULT
            max_steps: *LR_MAX_STEPS

    model_update:
        statistic:
            start_iter: 30_000
            end_iter: *TOTAL_ITER

        scale_pruning:
            start_iter: 30_000
            end_iter: *TOTAL_ITER
            interval_iter: 200
            radii_threshold: -1 # int means pixel, -1 means max(image_width, image_height), float means fraction of max(image_width, image_height)
            scale_threshold: 0.5 # unit: m, proportional to scene extent

        contribution_pruning:
            start_iter: 30_000
            end_iter: *TOTAL_ITER
            interval_iter: 1000
            min_view_count: 100
            target_point_num: null
            prune_ratio: 0.15 # max(point_num - target_point_num, 0) * prune_ratio points will be pruned every pruning iterval
            max_prune_ratio: 0.2
            contrib_max_ratio: 0.0
            sparsity_retain_ratio: 0.1

        gamma_schedule:
            start_iter: *SOLIDIFY_START_ITER
            end_iter: *SOLIDIFY_END_ITER
            gamma_init: 1.0
            gamma_final: 50.0

        sh_schedule:
            one_up_iters: [1000, 2000, 3000]

trainer:
    output_dir: "outputs/NerfSynthetic/VanillaTS"
    clean_output_dir: False # clean output_dir before training
    detect_anomaly: False
    seed: null
    use_tensorboard: True
    save_train_img: True
    save_eval_img: False

    start_checkpoint: null
    start_pointcloud: 30_000
    start_opacity: 0.5
    initial_eval: False
    iterations: *TOTAL_ITER
    batch_size: 1
    log_interval_iter: 200
    eval_interval_iter: 2_000
    histogram_interval_iter: 5_000
    save_interval_iter: 0
    ckpt_interval_iter: 0
    save_iterations: [*SOLIDIFY_START_ITER, *TOTAL_ITER]
    checkpoint_iterations: []
    save_mesh_iterations: [*TOTAL_ITER]

    train_background: null # "white" | "black" | "random" | null, if null, use dataset background
    eval_background: null # "white" | "black" | "random" | null, if null, use dataset background
    train_alpha_mask: False
    eval_alpha_mask: False

    w_L1: 0.8
    w_L2: 0.0
    w_ssim: 0.2
    w_dog: 0.0
    smoothness_loss:
        w_image: 0.0
        w_normal: 0.05
        w_depth: 0.0
        start_iter: 3_000
    geometry_loss:
        w_geometry: 0.05
        scale_factor: null
        start_iter: 3_000
    distortion_loss:
        w_distortion: 0.05
        start_iter: 3_000

    w_scaling_reg: 0.0
    w_affine_reg: 0.0
    opacity_reg:
        w_opacity_reg: 0.0 # -0.01
        start_iter: 3_000
        type: "quad" # "quad" | "linear"
    vertex_reg:
        w_vertex_reg: 0.0
        start_iter: 0
        interval_iter: 10

    eval_save_img_count: 3
    histogram_sample_num: 10_000
